[project]
name = "nexora-api"
version = "0.1.0"
description = "NEXORA AI AUTOPILOT backend — YouTube content research, production, publishing and analytics automation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "feedparser>=6.0",
    "boto3>=1.34",
    "Pillow>=10.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nexora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call real third-party APIs and are excluded by default. Run them with
# `pytest -m live`; they skip themselves when no credential is configured.
addopts = "-q -m 'not live'"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "live: calls a real external API; requires a credential and network access",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["B008", "E501"]
